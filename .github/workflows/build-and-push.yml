name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          echo '${{ toJson(secrets) }}' | jq -r 'to_entries[] | select(.key != "github_token") | "\(.key)=\(.value)"' > .env

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/saas-template:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/saas-template:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
